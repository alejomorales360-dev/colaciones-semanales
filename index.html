<div id="app"></div>

<script>
(function(){
'use strict';

const DIAS = ['Lunes','Martes','Miercoles','Jueves','Viernes'];
const state = {
  role: null,        // 'admin' | 'trabajador'
  admin: false,
  adminPassword: null, // solo en memoria (no se guarda), para autorizar acciones de admin en el backend
  trabajador: null,  // {rut,nombre,tipo}
  data: { trabajadores:[], menus:[], pedidos:[], config:{}, semanas:[], feriados:[] },
  semanaRef: mondayOf(new Date()),
  adminTab: 'trabajadores',
  msg: null,
  editandoRut: null,   // RUT en edición en Reportes (null = nadie)
  forzarEdicionMenu: false, // admin desbloqueó edición del menú tras el cierre
  abiertoCierre: false,     // acordeón "Cierre de inscripciones" abierto
  abiertoCatalogo: false,   // acordeón "Catálogo de platos" abierto
  periodoDesde: iso(addDays(mondayOf(new Date()), -21)),
  periodoHasta: iso(addDays(mondayOf(new Date()), 4)),
  diasGuardandoPedido: new Set(), // claves "semana|dia" con un guardado optimista en curso (ver renderTrabajadorBody)
  semanasTocadas: new Set() // semanas donde el trabajador ya tocó al menos una opción en esta sesión (ver aviso de día sin elegir)
};

// ---------- fechas ----------
function mondayOf(d){
  const x = new Date(d);
  const day = x.getDay(); // 0=domingo
  const diff = (day === 0 ? -6 : 1 - day);
  x.setDate(x.getDate() + diff);
  x.setHours(0,0,0,0);
  return x;
}
function iso(d){ return d.toISOString().slice(0,10); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function fmtSemana(d){
  const fin = addDays(d,4);
  const opt = {day:'numeric',month:'short'};
  return `${d.toLocaleDateString('es-CL',opt)} – ${fin.toLocaleDateString('es-CL',opt)} (${d.getFullYear()})`;
}
function fechaDia(semanaMonday, diaNombre){
  const idx = DIAS.indexOf(diaNombre);
  return iso(addDays(semanaMonday, idx));
}
// Instante en que cierran las inscripciones de la semana cuyo lunes es
// semanaMonday: "cierre_dias_antes" días antes, a las "cierre_hora".
// Por defecto: miércoles de la semana previa a las 14:00. Debe coincidir
// con calcularCierreCol() en gas/Colaciones.gs.
function calcularCierre(semanaMonday, config){
  config = config||{};
  const diasAntes = Number(config.cierre_dias_antes);
  const dias = isNaN(diasAntes) ? 5 : diasAntes;
  const hora = String(config.cierre_hora || '14:00').trim();
  const [hh,mm] = hora.split(':').map(n=>Number(n)||0);
  const cierre = addDays(semanaMonday, -dias);
  cierre.setHours(hh, mm, 0, 0);
  return cierre;
}
function inscripcionesCerradas(semanaMonday, config){
  return new Date() > calcularCierre(semanaMonday, config);
}
// Primera semana (desde la actual en adelante) que todavía admite ingresar
// el menú. Como el cierre por defecto cae antes de que la semana empiece,
// la semana "actual" casi siempre ya está cerrada; el admin necesita partir
// viendo la próxima semana abierta, no una ya bloqueada.
function proximaSemanaAbierta(config){
  let semana = mondayOf(new Date());
  let intentos = 0;
  while(inscripcionesCerradas(semana, config) && intentos < 12){
    semana = addDays(semana, 7);
    intentos++;
  }
  return semana;
}
// Rescata un HH:MM valido desde cualquier valor guardado en cierre_hora,
// incluso si quedo corrompido como una fecha/hora completa (ISO); si no
// encuentra nada usable, devuelve el valor por defecto.
function horaValidaOr(valor, porDefecto){
  const m = String(valor||'').match(/(\d{1,2}):(\d{2})/);
  if(!m) return porDefecto;
  const hh = String(Math.min(23,Number(m[1]))).padStart(2,'0');
  return `${hh}:${m[2]}`;
}
function fmtCierre(d){
  const opt = {weekday:'long', day:'numeric', month:'long'};
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${d.toLocaleDateString('es-CL',opt)}, ${hh}:${mm} hrs`;
}

// ---------- Diálogos propios (reemplazan alert()/confirm()) ----------
// El alert()/confirm() nativos del navegador muestran la URL del sitio y no
// se pueden personalizar ni maquetar con dos botones a gusto. Estas
// funciones dibujan una ventana propia (mismos colores de la app) y
// devuelven una Promise, para poder usarlas con await igual que antes.
function mostrarDialogo({tipo='info', titulo, texto, botones}){
  return new Promise(resolve=>{
    const ICONOS = {info:'ℹ️', warn:'⚠️', danger:'🗑️', ok:'✅'};
    const overlay = el('div',{class:'dlg-overlay'});
    const box = el('div',{class:'dlg-box dlg-'+tipo});
    box.appendChild(el('div',{class:'dlg-icon'}, ICONOS[tipo]||ICONOS.info));
    box.appendChild(el('h3',{class:'dlg-title'}, titulo));
    box.appendChild(el('p',{class:'dlg-text'}, texto));
    const row = el('div',{class:'dlg-actions'});
    let resuelto = false;
    const cerrar = (valor)=>{
      if(resuelto) return;
      resuelto = true;
      overlay.remove();
      resolve(valor);
    };
    botones.forEach(b=>{
      const btn = el('button',{class:'dlg-btn'+(b.primary?' primary':'')}, b.label);
      btn.onclick = ()=>cerrar(b.value);
      row.appendChild(btn);
    });
    box.appendChild(row);
    overlay.appendChild(box);
    // Tocar fuera del cuadro equivale a la opción "segura" (la primera de
    // la lista, normalmente cancelar/quedarse), nunca a la acción principal.
    overlay.onclick = (e)=>{ if(e.target===overlay) cerrar(botones[0].value); };
    document.body.appendChild(overlay);
  });
}
// Reemplazo de alert(): un solo botón. tipo: 'info' | 'warn' | 'danger' | 'ok'.
function avisar(texto, tipo='info', titulo){
  const TITULOS = {info:'Aviso', warn:'Atención', danger:'Ocurrió un problema', ok:'Listo'};
  return mostrarDialogo({tipo, titulo: titulo||TITULOS[tipo], texto, botones:[{label:'Entendido', value:true, primary:true}]});
}
// Reemplazo de confirm(): dos botones, devuelve true/false.
function preguntar(texto, {titulo='¿Confirmas?', tipo='warn', labelSi='Sí, continuar', labelNo='Cancelar'}={}){
  return mostrarDialogo({tipo, titulo, texto, botones:[
    {label:labelNo, value:false},
    {label:labelSi, value:true, primary:true}
  ]});
}

// ---------- API ----------
// fetch() no tiene timeout propio: si la conexión se cuelga a medias (típico
// en celulares con mala señal), la promesa de fetch no se resuelve NI se
// rechaza nunca, y el .catch(jsonp) de más abajo jamás se alcanza — el botón
// que espera la respuesta queda pegado para siempre. Por eso todo fetch al
// backend va con un AbortController con límite de tiempo, para garantizar
// que siempre caiga al respaldo JSONP en un plazo acotado.
function fetchConTimeout(url, opciones, msTimeout){
  const controlador = new AbortController();
  const timer = setTimeout(()=> controlador.abort(), msTimeout);
  return fetch(url, {...(opciones||{}), signal: controlador.signal}).finally(()=> clearTimeout(timer));
}
function callApi(body){
  if(!GAS_URL || GAS_URL.indexOf('PEGA_AQUI') === 0){
    return Promise.resolve({ok:false, error:'Falta configurar GAS_URL en index.html.'});
  }
  // El backend exige esta clave en toda acción de administración (ver
  // ACCIONES_ADMIN en Colaciones.gs): sin ella, cualquiera que descubra la
  // URL /exec podría editar datos sin haber iniciado sesión como admin.
  if(state.role==='admin' && state.adminPassword) body = {...body, adminPassword: state.adminPassword};
  // 6s+8s (14s peor caso) en vez de 9s+15s (24s): con 60 personas
  // conectándose casi a la vez, esperar 24 segundos completos antes de
  // avisar que algo falló se sentía como que la app estaba "pegada".
  return fetchConTimeout(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  }, 6000).then(r=>r.json()).catch(()=> jsonp(body));
}
function jsonp(body){
  return new Promise((resolve)=>{
    const cbName = 'cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6);
    window[cbName] = (data)=>{ resolve(data); cleanup(); };
    const script = document.createElement('script');
    const params = new URLSearchParams();
    params.set('callback', cbName);
    if(body !== undefined) params.set('body', encodeURIComponent(JSON.stringify(body)));
    script.src = GAS_URL + '?' + params.toString();
    script.onerror = ()=>{ resolve({ok:false,error:'No se pudo conectar al servidor.'}); cleanup(); };
    document.body.appendChild(script);
    function cleanup(){ delete window[cbName]; script.remove(); }
    setTimeout(()=>{ if(window[cbName]){ resolve({ok:false,error:'Tiempo de espera agotado.'}); cleanup(); } }, 8000);
  });
}
// Reintenta una vez una llamada de solo lectura (nunca para acciones que
// modifican datos: reintentar guardarPedido/eliminarPedido a ciegas podría
// enmascarar una respuesta que en realidad sí llegó a completarse). Un
// fallo puntual (mala señal, una petición que se cae) suele resolverse solo
// en el segundo intento sin que el usuario tenga que volver a tocar nada.
// Si el primer intento ya se demoró el máximo posible (~14s: la conexión
// realmente no responde, no fue un tropiezo puntual), no vale la pena
// reintentar — solo duplicaría la espera sin cambiar el resultado.
async function callApiConReintento(body){
  const inicio = Date.now();
  const primero = await callApi(body);
  if(primero && primero.ok) return primero;
  if(Date.now() - inicio > 10000) return primero;
  return callApi(body);
}

// ---------- render root ----------
function render(){
  const app = document.getElementById('app');
  try{
    if(!state.role){ app.innerHTML=''; app.appendChild(renderLogin()); return; }
    if(state.role==='admin'){ app.innerHTML=''; app.appendChild(renderAdmin()); return; }
    app.innerHTML=''; app.appendChild(renderTrabajador());
  } catch(err){
    // Red de seguridad: si algo deja el estado en una forma inesperada
    // (respuesta corrupta del servidor, etc.), esto evita una pantalla en
    // blanco sin salida — se ve un botón para reiniciar la sesión en vez de
    // tener que recargar la página a ciegas.
    console.error('Error al renderizar:', err);
    app.innerHTML='';
    const box = el('div',{class:'center'});
    const card = el('div',{class:'login-card'});
    card.appendChild(el('div',{class:'msg err'},'Ocurrió un error inesperado. Vuelve a intentar.'));
    const btn = el('button',{class:'btn primary',style:'margin-top:12px'},'Reiniciar sesión');
    btn.onclick = ()=>{ state.role=null; state.admin=false; state.adminPassword=null; state.trabajador=null; render(); };
    card.appendChild(btn);
    box.appendChild(card);
    app.appendChild(box);
  }
}

// Pone/quita un pequeño spinner girando dentro de un botón mientras dura una
// petición, además de deshabilitarlo — más claro que solo cambiar el texto
// en una conexión lenta (que es justamente cuando más se necesita el aviso).
function setBotonCargando(btn, cargando, textoNormal, textoCargando){
  if(cargando){
    btn.disabled = true;
    btn.innerHTML = '';
    btn.appendChild(el('span',{class:'spinner'}));
    btn.appendChild(document.createTextNode(textoCargando));
  } else {
    btn.disabled = false;
    btn.textContent = textoNormal;
  }
}
// ---------- LOGIN ----------
function renderLogin(){
  const wrap = el('div',{class:'center'});
  const card = el('div',{class:'login-card'});
  card.appendChild(el('div',{class:'login-icon'},'🍽️'));
  card.appendChild(el('h1',{},'Colaciones Semanales'));
  card.appendChild(el('p',{class:'sub'},'Anótate al menú de la semana o ingresa como administración.'));

  const picker = el('div',{class:'role-picker'});
  const bT = el('button',{class:'role-card active'});
  bT.append(el('div',{class:'role-icon'},'👷'), el('div',{class:'role-label'},'Trabajador/a'), el('div',{class:'role-desc'},'Anótate con tu RUT'));
  const bA = el('button',{class:'role-card'});
  bA.append(el('div',{class:'role-icon'},'🔐'), el('div',{class:'role-label'},'Administración'), el('div',{class:'role-desc'},'Menús y reportes'));
  picker.append(bT,bA);
  card.appendChild(picker);

  // <form> reales (no solo divs) y autocomplete correcto en cada campo: es
  // lo que le permite al navegador ofrecer "¿Guardar RUT/clave?" y
  // autocompletarlos la próxima vez, en vez de tener que escribirlos de
  // memoria cada semana.
  const formT = el('form',{class:'role-form', autocomplete:'on'});
  formT.appendChild(field('Tu RUT','text','loginRut','Ej: 12345678-9',true,'username'));
  const btnT = el('button',{type:'submit',class:'btn primary',style:'width:100%;margin-top:6px'},'Ingresar');
  formT.appendChild(btnT);

  const formA = el('form',{class:'role-form role-admin', autocomplete:'on', hidden:'true'});
  formA.appendChild(fieldPassword('Clave de administración','loginPass','current-password'));
  const btnA = el('button',{type:'submit',class:'btn admin',style:'width:100%;margin-top:6px'},'Ingresar como admin');
  formA.appendChild(btnA);

  const msgBox = el('div',{});
  card.append(formT, formA, msgBox);
  wrap.appendChild(card);

  // Enfoca el campo del formulario recién mostrado: en el celular ahorra un
  // toque extra antes de poder escribir.
  bT.onclick = ()=>{ bT.classList.add('active'); bA.classList.remove('active','role-admin'); formT.hidden=false; formA.hidden=true; msgBox.innerHTML=''; formT.querySelector('input').focus(); };
  bA.onclick = ()=>{ bA.classList.add('active','role-admin'); bT.classList.remove('active'); formA.hidden=false; formT.hidden=true; msgBox.innerHTML=''; formA.querySelector('input').focus(); };

  // onsubmit (no solo onclick del botón): al ser un <form> real con un botón
  // type="submit", esto también captura Enter dentro del campo, y es lo que
  // hace que el navegador reconozca el envío y ofrezca guardar el dato.
  formT.onsubmit = async (e)=>{
    e.preventDefault();
    const rut = card.querySelector('#loginRut').value.trim();
    if(!rut){ return; }
    setBotonCargando(btnT, true, 'Ingresar', 'Ingresando…');
    const res = await callApiConReintento({action:'loginTrabajador', rut});
    setBotonCargando(btnT, false, 'Ingresar', 'Ingresando…');
    // Antes de comprometer el estado global, se valida que la respuesta
    // tenga la forma esperada: una respuesta incompleta o corrupta (posible
    // bajo carga, o si el fallback JSONP entrega algo raro) no debe dejar
    // state.role a medio configurar, porque eso deja la pantalla rota sin
    // ningún mensaje y sin forma de volver salvo recargar la página.
    if(!res || !res.ok || !res.trabajador || !res.trabajador.rut){
      msgBox.innerHTML=''; msgBox.appendChild(el('div',{class:'msg err'}, (res&&res.error)||'No se pudo ingresar. Intenta de nuevo.')); return;
    }
    state.role='trabajador';
    state.trabajador = res.trabajador;
    state.data.menus = res.menus||[];
    state.data.pedidos = res.pedidos||[];
    state.data.config = res.config||{};
    state.data.feriados = res.feriados||[];
    render();
  };

  formA.onsubmit = async (e)=>{
    e.preventDefault();
    const pass = card.querySelector('#loginPass').value;
    setBotonCargando(btnA, true, 'Ingresar como admin', 'Ingresando…');
    const res = await callApiConReintento({action:'loginAdmin', password:pass});
    setBotonCargando(btnA, false, 'Ingresar como admin', 'Ingresando…');
    if(!res || !res.ok || !res.config){
      msgBox.innerHTML=''; msgBox.appendChild(el('div',{class:'msg err'}, (res&&res.error)||'Clave incorrecta o respuesta inválida del servidor. Intenta de nuevo.'));
      return;
    }
    state.role='admin';
    state.adminPassword = pass;
    state.data = res;
    state.semanaRef = proximaSemanaAbierta(res.config);
    render();
  };

  // El foco inicial se pone recién cuando el nodo ya está en el DOM (justo
  // después de este return), si no el navegador lo ignora.
  setTimeout(()=>{ const i = formT.querySelector('input'); if(i) i.focus(); }, 0);

  return wrap;
}

function topHeader(title, who, onExit, onRefrescar, opts){
  opts = opts || {};
  const hdr = el('div',{class:'hdr no-print'});

  if(opts.avatar) inn.appendChild(el('div',{class:'avatar-ini',title:who||''}, opts.avatar));
  inn.appendChild(el('h1',{},title));
  if(who && !opts.avatar) inn.appendChild(el('span',{class:'who'}, who));
  if(onRefrescar){
    const btnRef = el('button',{class:'btn sm',title:'Actualizar datos'},'🔄');
    btnRef.onclick = async ()=>{
      btnRef.disabled = true; btnRef.textContent='…';
      await onRefrescar();
      btnRef.disabled = false; btnRef.textContent='🔄';

  hdr.appendChild(inn);
  return hdr;
}

// Chile: nombre completo suele venir como "ApellidoPaterno ApellidoMaterno
// Nombre1 Nombre2...". Se usa para el saludo y las iniciales del avatar.
function primerNombreDe(nombreCompleto){
  const partes = String(nombreCompleto||'').trim().split(/\s+/).filter(Boolean);
  if(!partes.length) return '';
  return partes.length>=3 ? partes[2] : partes[partes.length-1];
}
function inicialesDe(nombreCompleto){
  const partes = String(nombreCompleto||'').trim().split(/\s+/).filter(Boolean);
  if(!partes.length) return '';
  const primerNombre = primerNombreDe(nombreCompleto);
  return ((primerNombre[0]||'') + (partes[0][0]||'')).toUpperCase();
}
function renderTrabajador(){
  const root = el('div',{});
  const nombre = state.trabajador.nombre;
  const primerNombre = primerNombreDe(nombre);
  root.appendChild(topHeader(primerNombre?`Hola, ${primerNombre}`:'🍽️ Colaciones', nombre, async ()=>{
    if(!(await confirmarSiFaltaDia(iso(state.semanaRef), 'Salir igual'))) return;
    state.role=null; state.trabajador=null; render();
  }, null, {avatar:inicialesDe(nombre), salirRojo:true}));
  const wrap = el('div',{class:'wrap'});

  wrap.appendChild(weekNav(()=>renderTrabajadorBody(wrap)));
  root.appendChild(wrap);
  renderTrabajadorBody(wrap);
  return root;
}
function weekNav(onChange){
  const nav = el('div',{class:'week-nav no-print'});
  const prev = el('button',{class:'btn sm'},'‹');
  const lbl = el('div',{class:'lbl'}, fmtSemana(state.semanaRef));
  const next = el('button',{class:'btn sm'},'›');
  prev.onclick = async ()=>{
    if(!(await confirmarSiFaltaDia(iso(state.semanaRef), 'Cambiar de semana igual'))) return;
    state.semanaRef = addDays(state.semanaRef,-7); lbl.textContent = fmtSemana(state.semanaRef); onChange();
  };
  next.onclick = async ()=>{
    if(!(await confirmarSiFaltaDia(iso(state.semanaRef), 'Cambiar de semana igual'))) return;
    state.semanaRef = addDays(state.semanaRef, 7); lbl.textContent = fmtSemana(state.semanaRef); onChange();
  };
  nav.append(prev,lbl,next);
  return nav;
}
function renderTrabajadorBody(wrap){
  // remove previous body (everything after week-nav holder)
  Array.from(wrap.children).slice(1).forEach(c=>c.remove());
  const semana = iso(state.semanaRef);
  const menusSemana = state.data.menus.filter(m=>String(m.semana).trim()===semana && String(m.activo).toLowerCase()!=='no');
  const misPedidos = state.data.pedidos.filter(p=>String(p.semana).trim()===semana);

  if(state.msg){ wrap.appendChild(el('div',{class:`msg ${state.msg.type}`}, state.msg.text)); state.msg=null; }

  if(!menusSemana.length){
    wrap.appendChild(el('div',{class:'card'}, el('div',{class:'empty'},'Aún no se ha publicado el menú para esta semana.')));
    return;
  }

  const cerrado = inscripcionesCerradas(state.semanaRef, state.data.config);
  if(cerrado){
    wrap.appendChild(el('div',{class:'msg cerrado'}, `🔒 El plazo para anotarse a esta semana ya cerró (${fmtCierre(calcularCierre(state.semanaRef, state.data.config))}). Si necesitas cambiar tu elección, contacta a administración.`));
  } else {
    wrap.appendChild(el('div',{class:'msg info'}, `⏰ Puedes elegir o cambiar tu opción hasta el ${fmtCierre(calcularCierre(state.semanaRef, state.data.config))}.`));
  }

  const diasFeriadosSemana = DIAS.filter(d=>diaEsFeriado(semana,d));
  if(diasFeriadosSemana.length){
    wrap.appendChild(el('div',{class:'msg info'}, `🎉 ${diasFeriadosSemana.join(', ')} ${diasFeriadosSemana.length===1?'es feriado':'son feriados'} esta semana: no hay colación ese${diasFeriadosSemana.length===1?'':'s'} día${diasFeriadosSemana.length===1?'':'s'}.`));
  }
  const diasConMenu = DIAS.filter(d=>menusSemana.some(m=>m.dia===d) && !diaEsFeriado(semana,d));
  diasConMenu.forEach(dia=>{
    const opciones = menusSemana.filter(m=>m.dia===dia);
    const especial = esDiaEspecial(opciones);
    const card = el('div',{class:'day-card'+(especial?' especial':'')});
    const claveDia = semana+'|'+dia;
    const h3 = el('h3',{}, `${dia} · ${fechaDia(state.semanaRef,dia).split('-').reverse().join('-')}`);
    if(state.diasGuardandoPedido.has(claveDia)){
      h3.appendChild(el('span',{class:'spinner',style:'border-color:rgba(0,0,0,.15);border-top-color:var(--blue);margin-left:8px'}));
    }
    card.appendChild(h3);
    if(especial){
      const descEsp = descripcionEspecialDia(opciones);
      card.appendChild(el('div',{class:'pill especial',style:'display:block;width:fit-content;margin-bottom:10px'}, descEsp ? `🌟 Mejorado: ${descEsp}` : '🌟 Almuerzo mejorado'));
    }
    const actual = misPedidos.find(p=>p.dia===dia);
    // "guardando" bloquea este día mientras haya un guardado optimista en
    // curso. Se guarda en state (no en el DOM) porque la actualización
    // optimista vuelve a dibujar todo el día con nodos nuevos apenas se
    // hace clic: un dataset en el nodo viejo no serviría para bloquear el
    // nodo nuevo que el usuario ve y podría tocar de nuevo.
    const guardando = state.diasGuardandoPedido.has(claveDia);
    opciones.forEach(o=>{
      const isSel = actual && String(actual.opcion)===String(o.opcion);
      const bloqueadoDia = cerrado || guardando;
      const optEl = el('label',{class:'opt'+(isSel?' sel':'')+(bloqueadoDia?' locked':''), title: (isSel && !bloqueadoDia) ? 'Toca de nuevo para quitar tu elección' : ''});
      const radio = el('input',{type:'radio', name:'dia_'+dia});
      radio.checked = isSel;
      radio.disabled = bloqueadoDia;
      optEl.appendChild(radio);
      const txt = el('div',{class:'txt'});
      txt.appendChild(el('span',{class:'code'}, o.opcion+':'));
      txt.appendChild(document.createTextNode(o.descripcion||''));
      optEl.appendChild(txt);
      if(isSel && !bloqueadoDia) optEl.appendChild(el('span',{style:'font-size:11.5px;font-weight:700;color:var(--red);white-space:nowrap'},'✕ Quitar'));
      optEl.onclick = async (e)=>{
        e.preventDefault();
        // Evita que un doble toque (frecuente en mobile con conexión lenta)
        // dispare dos peticiones a la vez para el mismo día: sin esto, ambas
        // podían calcular el mismo índice "no existe todavía" y terminar
        // agregando dos pedidos duplicados en el estado local.
        if(cerrado || state.diasGuardandoPedido.has(claveDia)) return;
        if(isSel && !(await preguntar(`¿Quitar tu elección (${o.opcion}) de ${dia}?`, {titulo:'Quitar elección', labelSi:'Sí, quitar'}))) return;

        const rn = normRut(state.trabajador.rut);
        const idx = state.data.pedidos.findIndex(p=>p.semana===semana && p.dia===dia && normRut(p.rut)===rn);
        const filaAnterior = idx>=0 ? state.data.pedidos[idx] : null;
        // Actualización optimista: se muestra el cambio al instante (Apps
        // Script puede tardar 1-3+ segundos en responder, sobre todo con
        // varias personas anotándose a la vez) y se revierte solo si el
        // servidor termina rechazando el guardado.
        if(isSel){
          if(idx>=0) state.data.pedidos.splice(idx,1);
        } else {
          const nuevo = {semana, rut:state.trabajador.rut, nombre:state.trabajador.nombre, dia, opcion:o.opcion, timestamp:new Date().toISOString()};
          if(idx>=0) state.data.pedidos[idx]=nuevo; else state.data.pedidos.push(nuevo);
        }
        state.diasGuardandoPedido.add(claveDia);
        state.semanasTocadas.add(semana);
        renderTrabajadorBody(wrap);

        try{
          const res = isSel
            ? await callApi({action:'eliminarPedido', semana, rut:state.trabajador.rut, dia})
            : await callApi({action:'guardarPedido', data:{semana, rut: state.trabajador.rut, nombre: state.trabajador.nombre, dia, opcion:o.opcion}});
          if(res && res.ok){
            state.msg = isSel
              ? {type:'ok', text:`Quitaste tu elección de ${dia}.`}
              : {type:'ok', text:`Elegiste la opción ${o.opcion} para ${dia}.`};
          } else {
            // El servidor no confirmó: se revierte puntualmente esta fila
            // (nunca todo el arreglo) para no pisar otros pedidos que hayan
            // cambiado mientras tanto en otros días.
            const idxAhora = state.data.pedidos.findIndex(p=>p.semana===semana && p.dia===dia && normRut(p.rut)===rn);
            if(isSel){
              if(filaAnterior) state.data.pedidos.push(filaAnterior);
            } else if(idxAhora>=0){
              if(filaAnterior) state.data.pedidos[idxAhora]=filaAnterior; else state.data.pedidos.splice(idxAhora,1);
            }
            state.msg = {type:'err', text: (res&&res.error)||(isSel?'No se pudo quitar tu elección.':'No se pudo guardar tu elección.')};
          }
        } finally {
          state.diasGuardandoPedido.delete(claveDia);
          renderTrabajadorBody(wrap);
        }
      };
      card.appendChild(optEl);
    });
    wrap.appendChild(card);
  });

  const resumen = el('div',{class:'card'});
  resumen.appendChild(el('h2',{},'Lo que pediste esta semana'));
  if(!misPedidos.length){
    resumen.appendChild(el('div',{class:'empty'},'Todavía no has elegido ninguna opción.'));
  } else {
    const tblWrap = el('div',{class:'tbl-wrap'});
    const tbl = el('table',{class:'tbl-mi-pedido'});
    const thead = el('tr',{});
    thead.appendChild(el('th',{},'Día'));
    thead.appendChild(el('th',{},'Opción'));
    thead.appendChild(el('th',{},'Descripción'));
    tbl.appendChild(thead);
    DIAS.filter(d=>menusSemana.some(m=>m.dia===d)).forEach(d=>{
      const p = misPedidos.find(x=>x.dia===d);
      const m = p ? menusSemana.find(x=>x.dia===d && String(x.opcion)===String(p.opcion)) : null;
      const tr = el('tr',{});
      tr.appendChild(el('td',{},d));
      tr.appendChild(el('td',{}, p?el('span',{class:'pill blue'},p.opcion):el('span',{class:'pill no'},'Sin elegir')));
      tr.appendChild(el('td',{}, m ? (m.descripcion||'') : ''));
      tbl.appendChild(tr);
    });
    tblWrap.appendChild(tbl);
    resumen.appendChild(tblWrap);
  }
  wrap.appendChild(resumen);
}
function normRut(r){ return String(r||'').toLowerCase().replace(/\.|-|\s/g,'').trim(); }
// La opción "Ninguno (Ausente)" se arma igual que cualquier otra (el admin
// la agrega con "Agregar opción"), para obligar a que todos respondan la
// semana sí o sí: quien no tiene ni un pedido esa semana es porque no entró
// a la app, no porque decidiera no ir. Pero como no hay que prepararle
// colación a quien elige esa opción, se excluye de los totales de
// colaciones (gráficos, Excel, Reporte Sodexo) aunque sí cuenta como
// "anotado" (respondió).
function esOpcionAusente(descripcion){
  return String(descripcion||'').trim().toLowerCase()==='ninguno (ausente)';
}
function esPedidoAusente(pedido, opciones){
  const m = (opciones||[]).find(o=>String(o.opcion)===String(pedido.opcion) && (o.dia===undefined || o.dia===pedido.dia));
  return !!m && esOpcionAusente(m.descripcion);
}
// Cuenta pedidos de un día que sí son colación real (descarta los "Ninguno").
function contarColacionesDia(pedidosDia, opcionesDia){
  return pedidosDia.filter(p=>!esPedidoAusente(p, opcionesDia)).length;
}
// Igual, pero para toda una semana (opciones puede traer varios días mezclados).
function totalColacionesSemana(pedidosSemana, menusSemana){
  return pedidosSemana.filter(p=>!esPedidoAusente(p, menusSemana)).length;
}
function esDiaEspecial(opciones){ return opciones.some(o=>String(o.especial||'').toLowerCase()==='si'); }
// Por defecto BORRADOR (misma regla que el backend): una semana sin fila
// en state.data.semanas se considera NO publicada. Solo se ve publicada si
// hay una fila explícita "Si" — el admin siempre debe publicar a mano.
function semanaEstaPublicada(semanaIso){
  const fila = (state.data.semanas||[]).find(f=>String(f.semana).trim()===semanaIso);
  if(!fila) return false;
  return String(fila.publicada||'').toLowerCase()==='si';
}
function diaEsFeriado(semanaIso, dia){
  return (state.data.feriados||[]).some(f=>String(f.semana).trim()===semanaIso && String(f.dia).trim()===dia);
}
// Días de esa semana con menú (no feriados) que el trabajador todavía no
// eligió. Se usa para el aviso al cambiar de semana o salir — ver weekNav()
// y renderTrabajador().
function diasSinElegirTrabajador(semanaIso){
  const menusSemana = state.data.menus.filter(m=>String(m.semana).trim()===semanaIso && String(m.activo).toLowerCase()!=='no');
  const misPedidos = state.data.pedidos.filter(p=>String(p.semana).trim()===semanaIso);
  const diasConMenu = DIAS.filter(d=>menusSemana.some(m=>m.dia===d) && !diaEsFeriado(semanaIso,d));
  return diasConMenu.filter(d=>!misPedidos.some(p=>p.dia===d));
}
// Muestra el aviso de "te falta un día" solo si el trabajador ya tocó
// alguna opción de esa semana en esta sesión (nunca por solo mirarla) y
// todavía queda al menos un día sin elegir.
// Devuelve una Promise<boolean>: true si el trabajador puede continuar
// (cambiar de semana o salir), false si prefiere quedarse a completar el
// día que le falta. Da las dos opciones en vez de solo "Aceptar". Solo se
// pregunta si ya tocó alguna opción de esa semana en esta sesión (mirarla
// sin marcar nada no interrumpe nada).
function confirmarSiFaltaDia(semanaIso, labelContinuar){
  if(!state.semanasTocadas.has(semanaIso)) return Promise.resolve(true);
  const faltantes = diasSinElegirTrabajador(semanaIso);
  if(!faltantes.length) return Promise.resolve(true);
  const texto = `Todavía no elegiste almuerzo para ${faltantes.join(', ')} de la semana del ${fmtSemana(new Date(semanaIso+'T00:00:00'))}.`;
  return preguntar(texto, {titulo:'Te falta un día por elegir', tipo:'warn', labelNo:'Completar ahora', labelSi:labelContinuar||'Continuar igual'});
}
function descripcionEspecialDia(opciones){
  const o = opciones.find(o=>String(o.especial||'').toLowerCase()==='si' && o.descripcionespecial);
  return o ? String(o.descripcionespecial) : '';
}
function agregarPlatoLocal(nombre){
  nombre = String(nombre||'').trim();
  if(!nombre) return;
  if(!state.data.platos) state.data.platos = [];
  const yaExiste = state.data.platos.some(p=>p.toLowerCase()===nombre.toLowerCase());
  if(!yaExiste){ state.data.platos.push(nombre); state.data.platos.sort((a,b)=>a.localeCompare(b)); }
}

// Se sigue guardando internamente como "cierre_dias_antes" (relativo al
// lunes de cada semana), pero se muestra y edita como una fecha concreta
// —la del cierre de la semana que se está viendo— para que sea más claro
// que "5 días antes del lunes". Al guardar, se recalcula esa cantidad de
// días a partir de la fecha elegida, así la regla sigue aplicando igual a
// todas las semanas (futuras y pasadas), no solo a la que se ve ahora.
function buildCierreConfigBody(card){
  const cierreActual = calcularCierre(state.semanaRef, state.data.config);
  const row = el('div',{class:'row',style:'align-items:flex-end'});
  const fFecha = el('div',{class:'field',style:'max-width:170px'});
  fFecha.appendChild(el('label',{},'Fecha de cierre'));
  const inpFecha = el('input',{type:'date',value:iso(cierreActual)});
  fFecha.appendChild(inpFecha);
  const fHora = el('div',{class:'field',style:'max-width:140px'});
  fHora.appendChild(el('label',{},'Hora de cierre'));
  const inpHora = el('input',{type:'time',value:horaValidaOr(state.data.config.cierre_hora,'14:00')});
  fHora.appendChild(inpHora);
  const btnGuardar = el('button',{class:'btn primary',style:'margin-bottom:12px'},'Guardar');
  const msgBox = el('div',{style:'flex-basis:100%'});
  btnGuardar.onclick = async ()=>{
    const hora = inpHora.value.trim();
    if(!inpFecha.value || !/^\d{1,2}:\d{2}$/.test(hora)){
      msgBox.innerHTML=''; msgBox.appendChild(el('div',{class:'msg err'},'Revisa la fecha y la hora.'));
      return;
    }
    const fechaElegida = new Date(inpFecha.value+'T00:00:00');
    const dias = Math.round((mondayOf(state.semanaRef) - fechaElegida) / 86400000);
    btnGuardar.disabled = true;
    let r1 = await callApi({action:'guardarConfig', clave:'cierre_dias_antes', valor:dias});
    let r2 = await callApi({action:'guardarConfig', clave:'cierre_hora', valor:hora});
    // Son dos guardados independientes en el backend: si uno falla a mitad
    // de camino, reintentar solo el que falló para no dejar el servidor con
    // una combinación de fecha/hora que no corresponde a lo que se pidió.
    if(r1.ok && !r2.ok) r2 = await callApi({action:'guardarConfig', clave:'cierre_hora', valor:hora});
    else if(!r1.ok && r2.ok) r1 = await callApi({action:'guardarConfig', clave:'cierre_dias_antes', valor:dias});
    btnGuardar.disabled = false;
    msgBox.innerHTML='';
    if(r1.ok) state.data.config.cierre_dias_antes = dias;
    if(r2.ok) state.data.config.cierre_hora = hora;
    if(r1.ok && r2.ok){
      render();
    } else if(r1.ok || r2.ok){
      msgBox.appendChild(el('div',{class:'msg err'}, 'Se guardó solo parte del cambio (' + (r1.ok?'fecha OK, hora falló':'hora OK, fecha falló') + '). Vuelve a intentar para completar.'));
    } else {
      msgBox.appendChild(el('div',{class:'msg err'}, r1.error||r2.error||'No se pudo guardar.'));
    }
  };
  row.append(fFecha, fHora, btnGuardar, msgBox);
  card.appendChild(row);
  const dias = Number(state.data.config.cierre_dias_antes ?? 5);
  card.appendChild(el('div',{style:'font-size:12.5px;color:var(--t2);margin-bottom:14px'},
    `La fecha de arriba es la del cierre para la semana que estás viendo (${fmtSemana(state.semanaRef)}). Esa misma cantidad de días antes del lunes (${dias} día${dias===1?'':'s'}) se aplica automáticamente a todas las demás semanas. Después del cierre, los trabajadores ya no pueden elegir ni cambiar su opción; solo administración puede seguir editando pedidos de esa semana.`));

  const rowSitio = el('div',{class:'row',style:'align-items:flex-end'});
  const fSitio = el('div',{class:'field'});
  fSitio.appendChild(el('label',{},'Nombre del sitio (aparece arriba en el Reporte Sodexo)'));
  const inpSitio = el('input',{type:'text',value:state.data.config.nombre_sitio||'',placeholder:'Ej: ARENAL'});
  fSitio.appendChild(inpSitio);
  const btnGuardarSitio = el('button',{class:'btn sm',style:'margin-bottom:12px'},'Guardar');
  btnGuardarSitio.onclick = async ()=>{
    btnGuardarSitio.disabled = true;
    const res = await callApi({action:'guardarConfig', clave:'nombre_sitio', valor:inpSitio.value.trim()});
    btnGuardarSitio.disabled = false;
    if(res.ok){ state.data.config.nombre_sitio = inpSitio.value.trim(); btnGuardarSitio.textContent='✓'; setTimeout(()=>btnGuardarSitio.textContent='Guardar',1000); }
    else await avisar(res.error||'Error', 'danger');
  };
  rowSitio.append(fSitio, btnGuardarSitio);
  card.appendChild(rowSitio);
}

  const prev = el('button',{class:'btn sm'},'‹');
  const lbl = el('div',{class:'lbl'}, fmtSemana(state.semanaRef));
  const next = el('button',{class:'btn sm'},'›');
  prev.onclick=()=>{ state.semanaRef=addDays(state.semanaRef,-7); state.forzarEdicionMenu=false; render(); };
  next.onclick=()=>{ state.semanaRef=addDays(state.semanaRef,7); state.forzarEdicionMenu=false; render(); };
  nav.append(prev,lbl,next);
  box.appendChild(nav);

  const cerrado = inscripcionesCerradas(state.semanaRef, state.data.config);
  const bloqueado = cerrado && !state.forzarEdicionMenu;
  const bannerCierre = el('div',{class:`msg ${cerrado?'cerrado':'info'}`});
  bannerCierre.appendChild(document.createTextNode(
    (cerrado ? '🔒 Inscripciones cerradas para esta semana desde el ' : '⏰ Inscripciones abiertas para esta semana hasta el ')
    + fmtCierre(calcularCierre(state.semanaRef, state.data.config)) + '. '));
  if(cerrado){
    bannerCierre.appendChild(document.createTextNode(
      bloqueado ? 'El menú de esta semana quedó bloqueado (no se puede cambiar ni borrar). ' : 'Edición del menú desbloqueada temporalmente. '));
    const btnToggle = el('button',{class:'btn sm',style:'margin-left:6px'}, bloqueado ? '🔓 Editar de todas formas' : '🔒 Volver a bloquear');
    btnToggle.onclick = ()=>{ state.forzarEdicionMenu = !state.forzarEdicionMenu; render(); };
    bannerCierre.appendChild(btnToggle);
  }
  box.appendChild(bannerCierre);

  const semana = iso(state.semanaRef);
  const publicada = semanaEstaPublicada(semana);
  const hayMenuEstaSemana = state.data.menus.some(m=>m.semana===semana);
  const bannerPublicar = el('div',{class:`msg ${publicada?'info':'cerrado'}`, style:'display:flex;align-items:center;gap:10px;flex-wrap:wrap'});
  bannerPublicar.appendChild(document.createTextNode(
    publicada ? '✅ Esta semana está publicada: los trabajadores ya pueden verla y anotarse.'
               : '📝 Esta semana es un borrador: los trabajadores todavía NO la ven.'));
  const btnPublicar = el('button',{class:`btn sm${publicada?'':' primary'}`}, publicada ? '🔒 Volver a borrador' : '📢 Publicar semana');
  btnPublicar.disabled = !hayMenuEstaSemana;
  btnPublicar.onclick = async ()=>{
    btnPublicar.disabled = true;
    try{
      const res = await callApi({action:'marcarSemanaPublicada', semana, publicada: !publicada});
      if(res && res.ok){
        const idx = state.data.semanas.findIndex(f=>String(f.semana).trim()===semana);
        const fila = {semana, publicada: (!publicada) ? 'Si':'No'};
        if(idx>=0) state.data.semanas[idx]=fila; else state.data.semanas.push(fila);
      } else {
        await avisar((res&&res.error)||'No se pudo cambiar el estado de la semana.', 'danger');
      }
    } catch(err){
      await avisar('No se pudo conectar al servidor.', 'danger');
    } finally {
      render();
    }
  };
  bannerPublicar.appendChild(btnPublicar);
  box.appendChild(bannerPublicar);

  DIAS.forEach(dia=>{
    const opciones = state.data.menus.filter(m=>m.semana===semana && m.dia===dia);
    opciones.sort((a,b)=>String(a.opcion).localeCompare(String(b.opcion)));
    const especial = esDiaEspecial(opciones);
    const feriado = diaEsFeriado(semana, dia);
    const card = el('div',{class:'card'+(especial?' especial':'')+(feriado?' feriado':'')});
    const head = el('div',{class:'row',style:'justify-content:space-between'});
    head.appendChild(el('h2',{}, dia + (especial?' 🌟':'') + (feriado?' 🎉':'')));
    const lblFer = el('label',{style:'display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--red);cursor:pointer'});
    const chkFer = el('input',{type:'checkbox'});
    chkFer.checked = feriado;
    chkFer.disabled = bloqueado;
    lblFer.append(chkFer, document.createTextNode('🎉 Feriado (no se trabaja)'));
    chkFer.onchange = async ()=>{
      const nuevoValor = chkFer.checked;
      if(nuevoValor){
        const pedidosDelDia = state.data.pedidos.filter(p=>p.semana===semana && p.dia===dia).length;
        if(pedidosDelDia>0 && !(await preguntar(`Ya hay ${pedidosDelDia} pedido${pedidosDelDia===1?'':'s'} anotado${pedidosDelDia===1?'':'s'} para ${dia}. Al marcarlo feriado se eliminarán, porque ese día no habrá colación.`, {titulo:'Marcar día feriado', tipo:'danger', labelSi:'Sí, marcar feriado'}))){
          chkFer.checked = false;
          return;
        }
      }
      chkFer.disabled = true;
      try{
        const res = await callApi({action:'marcarFeriado', semana, dia, feriado:nuevoValor});
        if(res && res.ok){
          const idx = state.data.feriados.findIndex(f=>String(f.semana).trim()===semana && String(f.dia).trim()===dia);
          if(nuevoValor){ if(idx<0) state.data.feriados.push({semana,dia}); }
          else if(idx>=0) state.data.feriados.splice(idx,1);
          if(nuevoValor) state.data.pedidos = state.data.pedidos.filter(p=>!(p.semana===semana && p.dia===dia));
        } else {
          await avisar((res&&res.error)||'Error', 'danger');
        }
      } catch(err){
        await avisar('No se pudo conectar al servidor.', 'danger');
      } finally {
        // Igual que con "especial": siempre se vuelve a dibujar para que el
        // casillero refleje el estado real del servidor, funcione o no.
        render();
      }
    };
    head.appendChild(lblFer);
    if(feriado){
      card.appendChild(head);
      card.appendChild(el('div',{class:'msg info',style:'margin-bottom:0'},
        '🎉 Este día quedó marcado como feriado: no se trabaja, así que no habrá colación ni se les mostrará a los trabajadores como opción para anotarse.'));
      box.appendChild(card);
      return;
    }
    if(opciones.length){
      const lblEsp = el('label',{style:'display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--amber);cursor:pointer'});
      const chkEsp = el('input',{type:'checkbox'});
      chkEsp.checked = especial;
      chkEsp.disabled = bloqueado;
      lblEsp.append(chkEsp, document.createTextNode('🌟 Almuerzo mejorado este día'));
      chkEsp.onchange = async ()=>{
        const nuevoValor = chkEsp.checked;
        chkEsp.disabled = true;
        try{
          const res = await callApi({action:'marcarDiaEspecial', semana, dia, especial:nuevoValor});
          if(res.ok){
            opciones.forEach(o=>{
              o.especial = nuevoValor ? 'Si':'No';
              o.descripcionespecial = nuevoValor ? (o.descripcionespecial||'') : '';
            });
          } else {
            await avisar(res.error||'Error', 'danger');
          }
        } catch(err){
          await avisar('No se pudo conectar al servidor.', 'danger');
        } finally {
          // Se vuelve a dibujar siempre (haya funcionado o no) para que el
          // casillero y el bloque 🌟 nunca queden desincronizados: si la
          // llamada falló, esto restaura el estado real en vez de dejar el
          // bloque "pegado" en pantalla.
          render();
        }
      };
      head.appendChild(lblEsp);
    }
    card.appendChild(head);
    if(especial){
      const rEsp = el('div',{class:'row',style:'align-items:flex-start'});
      const codeFieldEsp = el('div',{class:'field',style:'max-width:70px'});
      codeFieldEsp.appendChild(el('label',{},'Opción'));
      const inpCodeEsp = el('input',{type:'text',value:'🌟',style:'text-align:center;font-weight:800;background:var(--am2);border-color:var(--amber);color:var(--amber)'});
      inpCodeEsp.disabled = true;
      codeFieldEsp.appendChild(inpCodeEsp);
      const descFieldEsp = el('div',{class:'field'});
      descFieldEsp.appendChild(el('label',{},'Qué incluye el almuerzo mejorado'));
      const descripcionGuardada = descripcionEspecialDia(opciones);
      const inpDescEsp = el('input',{type:'text',value:descripcionGuardada,placeholder:'Ej: Torta con bebida',style:'background:var(--am2);border-color:var(--amber)'});
      inpDescEsp.disabled = bloqueado;
      descFieldEsp.appendChild(inpDescEsp);
      const btnSaveEsp = el('button',{class:'btn sm',style:'margin-top:18px;background:var(--amber);border-color:var(--amber);color:#fff'},'Guardar');
      btnSaveEsp.disabled = bloqueado;
      const guardarDescEsp = async ()=>{
        const descripcionEspecial = inpDescEsp.value.trim();
        if(descripcionEspecial === inpDescEsp.dataset.guardado) return;
        if(inpDescEsp.dataset.busy==='1') return;
        inpDescEsp.dataset.busy = '1';
        btnSaveEsp.disabled = true;
        inpDescEsp.disabled = true;
        try{
          const res = await callApi({action:'marcarDiaEspecial', semana, dia, especial:true, descripcionEspecial});
          if(res.ok){
            opciones.forEach(o=>o.descripcionespecial = descripcionEspecial);
            inpDescEsp.dataset.guardado = descripcionEspecial;
            btnSaveEsp.textContent='✓'; setTimeout(()=>btnSaveEsp.textContent='Guardar',1000);
          } else await avisar(res.error||'Error', 'danger');
        } catch(err){
          await avisar('No se pudo conectar al servidor.', 'danger');
        } finally {
          inpDescEsp.dataset.busy = '';
          btnSaveEsp.disabled = bloqueado;
          inpDescEsp.disabled = bloqueado;
        }
      };
      inpDescEsp.dataset.guardado = descripcionGuardada;
      // Se guarda también al salir del campo (o con Enter), para que no
      // quede sin efecto si el admin olvida tocar el botón "Guardar" y los
      // trabajadores terminen viendo el aviso genérico sin el detalle.
      inpDescEsp.addEventListener('blur', guardarDescEsp);
      inpDescEsp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inpDescEsp.blur(); } });
      btnSaveEsp.onclick = guardarDescEsp;
      rEsp.append(codeFieldEsp, descFieldEsp, btnSaveEsp);
      card.appendChild(rEsp);
      if(!descripcionGuardada){
        card.appendChild(el('div',{class:'msg info',style:'margin-top:-4px;margin-bottom:12px;font-size:12.5px'},
          '👆 Escribe qué incluye el almuerzo mejorado: sin esto, los trabajadores solo verán el aviso genérico "Almuerzo mejorado".'));
      }
    }
    opciones.forEach(o=>{
      const r = el('div',{class:'row',style:'align-items:flex-start'});
      const codeField = el('div',{class:'field',style:'max-width:70px'});
      codeField.appendChild(el('label',{},'Opción'));
      const inpCode = el('input',{type:'text',value:o.opcion,style:'text-align:center;font-weight:800'});
      inpCode.disabled = true;
      codeField.appendChild(inpCode);
      const descField = el('div',{class:'field'});
      descField.appendChild(el('label',{},'Descripción'));
      const inpDesc = el('input',{type:'text',value:o.descripcion||'',list:'platos-datalist',autocomplete:'off'});
      inpDesc.disabled = bloqueado;
      descField.appendChild(inpDesc);
      const btnSave = el('button',{class:'btn sm primary',style:'margin-top:18px'},'Guardar');
      btnSave.disabled = bloqueado;
      btnSave.onclick = async ()=>{
        btnSave.disabled=true;
        const descripcion = inpDesc.value.trim();
        const res = await callApi({action:'guardarMenu', data:{semana,dia,opcion:o.opcion,descripcion}});
        btnSave.disabled=false;
        if(res.ok){ o.descripcion = descripcion; agregarPlatoLocal(descripcion); btnSave.textContent='✓'; setTimeout(()=>btnSave.textContent='Guardar',1000); }
        else await avisar(res.error||'Error', 'danger');
      };
      const btnDel = el('button',{class:'btn sm danger',style:'margin-top:18px'},'Quitar');
      btnDel.disabled = bloqueado;
      btnDel.onclick = async ()=>{
        if(!(await preguntar('¿Quitar esta opción del menú?', {titulo:'Quitar opción de menú', tipo:'danger', labelSi:'Sí, quitar'}))) return;
        btnDel.disabled=true;
        const res = await callApi({action:'eliminarMenu', semana, dia, opcion:o.opcion});
        if(res.ok){ state.data.menus = state.data.menus.filter(m=>!(m.semana===semana&&m.dia===dia&&m.opcion===o.opcion)); render(); }
        else { btnDel.disabled=false; await avisar(res.error||'Error', 'danger'); }
      };
      r.append(codeField, descField, btnSave, btnDel);
      card.appendChild(r);
    });

    const addRow = el('div',{class:'row',style:'align-items:flex-end'});
    const nextCode = String.fromCharCode(65 + opciones.length); // A, B, C...
    const codeField2 = el('div',{class:'field',style:'max-width:70px'});
    codeField2.appendChild(el('label',{},'Nueva opción'));
    const inpNewCode = el('input',{type:'text',value:nextCode,style:'text-align:center;font-weight:800',maxlength:'2'});
    inpNewCode.disabled = bloqueado;
    codeField2.appendChild(inpNewCode);
    const descField2 = el('div',{class:'field'});
    descField2.appendChild(el('label',{},'Descripción'));
    const inpNewDesc = el('input',{type:'text',placeholder:'Ej: Pollo al horno con arroz',list:'platos-datalist',autocomplete:'off'});
    inpNewDesc.disabled = bloqueado;
    descField2.appendChild(inpNewDesc);
    const btnAdd = el('button',{class:'btn green',style:'margin-bottom:12px'},'Agregar opción');
    btnAdd.disabled = bloqueado;
    btnAdd.onclick = async ()=>{
      const opcion = inpNewCode.value.trim().toUpperCase();
      const descripcion = inpNewDesc.value.trim();
      if(!opcion || !descripcion) return;
      btnAdd.disabled=true;
      agregarPlatoLocal(descripcion);
      const res = await callApi({action:'guardarMenu', data:{semana,dia,opcion,descripcion}});
      btnAdd.disabled=false;
      if(res.ok){ state.data.menus.push({semana,dia,opcion,descripcion,activo:'Si',especial:especial?'Si':'No'}); render(); }
      else await avisar(res.error||'Error', 'danger');
    };
    addRow.append(codeField2, descField2, btnAdd);
    card.appendChild(addRow);
    box.appendChild(card);
  });
  return box;
}

// ---- Admin: Reportes ----
// Calcula todos los datos de una semana (elegibles, anotados, sin
// anotarse, días especiales, etc.) a partir de su lunes en ISO. Se usa
// tanto en Reportes (una semana) como en el Reporte por periodo (varias).
function datosSemana(semanaIso){
  const semanaRef = new Date(semanaIso+'T00:00:00');
  const finSemana = iso(addDays(semanaRef,4));
  // Un día feriado no se cuenta como colación: se excluye de los menús de la
  // semana para que reportes, recordatorios y el desglose Sodexo no lo
  // traten como un día pendiente de anotarse.
  const menusSemana = state.data.menus.filter(m=>m.semana===semanaIso && !diaEsFeriado(semanaIso, m.dia));
  const pedidosSemana = state.data.pedidos.filter(p=>p.semana===semanaIso && !diaEsFeriado(semanaIso, p.dia));
  const elegibles = state.data.trabajadores.filter(t=>{
    if(String(t.activo).toLowerCase()!=='si') return false;
    if(String(t.tipo)!=='Spot') return true;
    const ini = t.fechainicio || '0000-01-01';
    const fin = t.fechafin || '9999-12-31';
    return ini <= finSemana && fin >= semanaIso;
  });
  const rutsAnotados = new Set(pedidosSemana.map(p=>normRut(p.rut)));
  const anotados = elegibles.filter(t=>rutsAnotados.has(normRut(t.rut)));
  const noAnotados = elegibles.filter(t=>!rutsAnotados.has(normRut(t.rut)));
  const diasEspeciales = new Set(DIAS.filter(d=>esDiaEspecial(menusSemana.filter(m=>m.dia===d))));
  const pedidosEspeciales = pedidosSemana.filter(p=>diasEspeciales.has(p.dia) && !esPedidoAusente(p, menusSemana)).length;
  return {semana:semanaIso, menusSemana, pedidosSemana, elegibles, anotados, noAnotados, diasEspeciales, pedidosEspeciales};
}

function statBox(n,label,cls){

// Grafico de barras simple en SVG puro (sin librerias externas): una barra
// por item, altura proporcional al maximo del set.
function svgBarras(items){
  const ns = 'http://www.w3.org/2000/svg';
  const w = 320, h = 150, padTop = 22, padBottom = 24;
  const max = Math.max(1, ...items.map(i=>i.value));
  const barW = (w - 16) / (items.length || 1);
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.setAttribute('width','100%');
  svg.setAttribute('style', `max-width:${w}px;display:block;margin:0 auto`);
  items.forEach((it,i)=>{
    const bh = Math.round((h-padTop-padBottom) * (it.value/max));
    const x = 8 + i*barW;
    const y = h - padBottom - bh;
    const rect = document.createElementNS(ns,'rect');
    rect.setAttribute('x', x + barW*0.18);
    rect.setAttribute('y', y);
    rect.setAttribute('width', barW*0.64);
    rect.setAttribute('height', Math.max(bh,1));
    rect.setAttribute('rx','4');
    rect.setAttribute('fill','var(--blue)');
    svg.appendChild(rect);
    const val = document.createElementNS(ns,'text');
    val.setAttribute('x', x + barW/2);
    val.setAttribute('y', Math.max(y-5, padTop-6));
    val.setAttribute('text-anchor','middle');
    val.setAttribute('font-size','11');
    val.setAttribute('font-weight','800');
    val.setAttribute('fill','var(--t1)');
    val.textContent = String(it.value);
    svg.appendChild(val);
    const lbl = document.createElementNS(ns,'text');
    lbl.setAttribute('x', x + barW/2);
    lbl.setAttribute('y', h-7);
    lbl.setAttribute('text-anchor','middle');
    lbl.setAttribute('font-size','10.5');
    lbl.setAttribute('fill','var(--t2)');
    lbl.textContent = it.label;
    svg.appendChild(lbl);
  });
  return svg;
}
// Grafico de torta (donut) en SVG puro: un solo anillo, porcentaje "ok" en
// verde y el resto en rojo, con el numero grande al centro.
function svgDonut(pctOk){
  const ns = 'http://www.w3.org/2000/svg';
  const size=110, r=42, c=size/2, stroke=15;
  const circ = 2*Math.PI*r;
  const svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('width','110'); svg.setAttribute('height','110');
  const bg = document.createElementNS(ns,'circle');
  bg.setAttribute('cx',c); bg.setAttribute('cy',c); bg.setAttribute('r',r);
  bg.setAttribute('fill','none'); bg.setAttribute('stroke','var(--red)'); bg.setAttribute('stroke-width',stroke);
  svg.appendChild(bg);
  const seg = document.createElementNS(ns,'circle');
  seg.setAttribute('cx',c); seg.setAttribute('cy',c); seg.setAttribute('r',r);
  seg.setAttribute('fill','none'); seg.setAttribute('stroke','var(--green)'); seg.setAttribute('stroke-width',stroke);
  seg.setAttribute('stroke-dasharray', `${circ*pctOk/100} ${circ}`);
  seg.setAttribute('stroke-linecap','round');
  seg.setAttribute('transform',`rotate(-90 ${c} ${c})`);
  svg.appendChild(seg);
  const txt = document.createElementNS(ns,'text');
  txt.setAttribute('x',c); txt.setAttribute('y',c+6);
  txt.setAttribute('text-anchor','middle'); txt.setAttribute('font-size','19'); txt.setAttribute('font-weight','800'); txt.setAttribute('fill','var(--t1)');
  txt.textContent = Math.round(pctOk)+'%';
  svg.appendChild(txt);
  return svg;
}

  const card = el('div',{class:'card no-print-charts'});

  const wrap = el('div',{class:'charts-wrap'});

  const donutWrap = el('div',{style:'display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap'});
  donutWrap.appendChild(svgDonut(pct));
  const legend = el('div',{});
  legend.appendChild(legendItem('var(--green)', `${okLabel}: ${okN} (${Math.round(pct)}%)`));
  legend.appendChild(legendItem('var(--red)', `${noLabel}: ${noN} (${Math.round(100-pct)}%)`));
  donutWrap.appendChild(legend);

// Panel aparte (no se imprime) para que administración fije o cambie el
// pedido de UNA persona en cualquier momento, incluso si el plazo normal
// de inscripción ya cerró.
function renderEditorPedido(persona, pedidosSemana, dias, menusPorDia, semana){
  const modal = el('div',{class:'modal-fullscreen no-print'});
  const body = el('div',{class:'modal-fullscreen-body'});
  const head = el('div',{class:'hdr-modal'});
  head.appendChild(el('h2',{}, `✏️ Editar pedido: ${persona.nombre} (${persona.rut})`));
  const btnCerrar = el('button',{class:'btn sm'},'✕ Cerrar');
  btnCerrar.onclick = ()=>{ state.editandoRut=null; render(); };
  head.appendChild(btnCerrar);
  body.appendChild(head);
  dias.forEach(d=>{
    const opciones = menusPorDia[d]||[];
    const actual = pedidosSemana.find(x=>normRut(x.rut)===normRut(persona.rut) && x.dia===d);
    const row = el('div',{class:'field'});
    row.appendChild(el('label',{}, d));
    const sel = el('select',{});
    sel.appendChild(el('option',{value:''},'— Sin elegir'));
    opciones.forEach(o=>{
      const opt = el('option',{value:o.opcion}, `${o.opcion}: ${o.descripcion||''}`);
      if(actual && String(actual.opcion)===String(o.opcion)) opt.selected = true;
      sel.appendChild(opt);
    });
    if(!actual) sel.value = '';
    sel.onchange = async ()=>{
      sel.disabled = true;
      const opcion = sel.value;
      const res = opcion
        ? await callApi({action:'guardarPedido', data:{semana, rut:persona.rut, nombre:persona.nombre, dia:d, opcion, asAdmin:true}})
        : await callApi({action:'eliminarPedido', semana, rut:persona.rut, dia:d, asAdmin:true});
      sel.disabled = false;
      if(res.ok){
        const idx = state.data.pedidos.findIndex(p=>p.semana===semana && p.dia===d && normRut(p.rut)===normRut(persona.rut));
        if(opcion){
          const nuevo = {semana, rut:persona.rut, nombre:persona.nombre, dia:d, opcion, timestamp:new Date().toISOString()};
          if(idx>=0) state.data.pedidos[idx]=nuevo; else state.data.pedidos.push(nuevo);
        } else if(idx>=0){
          state.data.pedidos.splice(idx,1);
        }
        render();
      } else await avisar(res.error||'Error', 'danger');
    };
    row.appendChild(sel);
    body.appendChild(row);
  });
  modal.appendChild(body);
  return modal;
}
// Nombre de hoja de Excel valido: maximo 31 caracteres, sin \/?*[]:  y sin
// repetirse dentro del mismo libro.
function nombreHojaUnico(base, usados){
  let limpio = String(base).replace(/[\\/?*[\]:]/g,'').slice(0,31) || 'Hoja';
  let nombre = limpio, n = 2;
  while(usados.has(nombre)){ nombre = (limpio.slice(0,28)+' '+n).slice(0,31); n++; }
  usados.add(nombre);
  return nombre;
}
const MESES_COL = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
// "LUNES 07 SEPTIEMBRE" a partir de una fecha AAAA-MM-DD y el nombre del dia.
function tituloDiaFecha(fechaIso, dia){
  const [,m,d] = fechaIso.split('-');
  return `${dia.toUpperCase()} ${d} ${MESES_COL[Number(m)-1]}`;
}
// Cuenta cuantas veces se eligio cada plato ese dia (agrupando por el texto
// de la descripcion, no por la letra de opcion) y aparte cuantos pedidos no
// calzan con ningun plato con descripcion (van al total como "Colación",
// igual que en la planilla de referencia de Sodexo).
function desgloseDiaSodexo(pedidosDia, opcionesDia){
  const conteos = new Map();
  let colacion = 0;
  let ausentes = 0;
  pedidosDia.forEach(p=>{
    const m = opcionesDia.find(o=>String(o.opcion)===String(p.opcion));
    if(m && esOpcionAusente(m.descripcion)){ ausentes++; return; }
    const desc = (m && m.descripcion && String(m.descripcion).trim()) ? String(m.descripcion).trim() : '';
    if(!desc){ colacion++; return; }
    conteos.set(desc, (conteos.get(desc)||0)+1);
  });
  const platos = Array.from(conteos.entries());
  const total = platos.reduce((s,[,q])=>s+q,0);
  return { platos, total, colacion, ausentes, totalDia: total+colacion };
}
// Bloque RESUMEN (platos + cantidad, Total, Colación, Total <día>) para uno
// o varios días puestos en columnas una al lado de la otra, como en la hoja
// general de Sodexo. Devuelve las filas a continuación de las que ya tenga
// la hoja, más el rango a fusionar para la etiqueta "RESUMEN".
function filasResumenSodexo(diasInfo, filaInicial, colInicial){
  const desgloses = diasInfo.map(d=>desgloseDiaSodexo(d.pedidos, d.opciones));
  const maxPlatos = Math.max(0, ...desgloses.map(x=>x.platos.length));
  const totalFilas = maxPlatos + 4;
  const filas = [];
  for(let i=0;i<totalFilas;i++){
    const fila = [];
    if(i===0) fila[0] = 'RESUMEN';
    diasInfo.forEach((d,di)=>{
      const desg = desgloses[di];
      const c1 = colInicial + di*2, c2 = c1+1;
      if(i < desg.platos.length){ fila[c1]=desg.platos[i][0]; fila[c2]=desg.platos[i][1]; }
      else if(i===maxPlatos){ fila[c1]='Total'; fila[c2]=desg.total; }
      else if(i===maxPlatos+1){ fila[c1]='Colación'; fila[c2]=desg.colacion||''; }
      else if(i===maxPlatos+2){ fila[c1]='Ausentes (Ninguno)'; fila[c2]=desg.ausentes||''; }
      else if(i===maxPlatos+3){ fila[c1]=`Total ${d.label}`; fila[c2]=desg.totalDia; }
    });
    filas.push(fila);
  }
  return { filas, merge: { s:{r:filaInicial,c:0}, e:{r:filaInicial+totalFilas-1,c:1} } };
}
// Hoja "General": una fila por persona con el plato elegido cada día (o
// "SIN ANOTARSE" si de verdad no tiene ningún pedido ese día — distinto de
// "Ninguno (Ausente)", que es una opción real que alguien eligió), y debajo
// el resumen de todos los días uno al lado del otro.
function hojaGeneralSodexo(personas, diasInfo){
  const header = ['N°','Nombre', ...diasInfo.map(d=>d.label)];
  const filas = [header];
  personas.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre))).forEach((t,idx)=>{
    const fila = [idx+1, t.nombre];
    diasInfo.forEach(d=>{
      const p = d.pedidos.find(x=>normRut(x.rut)===normRut(t.rut));
      if(!p){ fila.push('SIN ANOTARSE'); return; }
      const m = d.opciones.find(o=>String(o.opcion)===String(p.opcion));
      fila.push((m && m.descripcion && String(m.descripcion).trim()) ? m.descripcion : 'Colación');
    });
    filas.push(fila);
  });
  filas.push([]);
  const { filas: filasResumen, merge } = filasResumenSodexo(diasInfo, filas.length, 2);
  filas.push(...filasResumen);
  const ws = XLSX.utils.aoa_to_sheet(filas);
  ws['!merges'] = [merge];
  return ws;
}
// Hoja de un solo día: N°|RUT|Nombre|Plato de quienes se anotaron ese día
// (para facturar/preparar), más su propio resumen abajo.
function hojaDiaSodexo(pedidosDia, opciones, trabajadores, nombreSitio, label){
  const filas = [];
  if(nombreSitio) filas.push([nombreSitio]);
  filas.push(['N°','RUT','Nombre','Plato']);
  pedidosDia
    .map(p=>{
      const t = trabajadores.find(x=>normRut(x.rut)===normRut(p.rut));
      if(!t) return null;
      const m = opciones.find(o=>String(o.opcion)===String(p.opcion));
      return { rut:t.rut, nombre:t.nombre, plato:(m && m.descripcion && String(m.descripcion).trim()) ? m.descripcion : 'Colación' };
    })
    .filter(Boolean)
    .sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)))
    .forEach((t,idx)=>filas.push([idx+1, t.rut, t.nombre, t.plato]));
  filas.push([]);
  const { filas: filasResumen, merge } = filasResumenSodexo([{label, pedidos:pedidosDia, opciones}], filas.length, 2);
  filas.push(...filasResumen);
  const ws = XLSX.utils.aoa_to_sheet(filas);
  ws['!merges'] = [merge];
  return ws;
}
// Reporte Sodexo de una semana: hoja "General" (todos los días uno al lado
// del otro + resumen general) más una hoja por día con menú publicado,
// cada una con su propio resumen.
// diasInfo compartido entre el Excel y el PDF "bonito" del Reporte Sodexo,
// para que ambos muestren siempre los mismos datos.
function diasInfoSodexoSemana(diasConMenu, pedidosSemana, menusSemana, semanaRef){
  return diasConMenu.map(dia=>({
    dia,
    label: tituloDiaFecha(fechaDia(semanaRef,dia), dia),
    pedidos: pedidosSemana.filter(p=>p.dia===dia),
    opciones: menusSemana.filter(m=>m.dia===dia)
  }));
}
function diasInfoSodexoPeriodo(datosPorSemana){
  const diasInfo = [];
  datosPorSemana.forEach(d=>{
    const semanaRef = new Date(d.semana+'T00:00:00');
    DIAS.filter(dia=>d.menusSemana.some(m=>m.dia===dia)).forEach(dia=>{
      diasInfo.push({
        dia,
        label: tituloDiaFecha(fechaDia(semanaRef,dia), dia),
        pedidos: d.pedidosSemana.filter(p=>p.dia===dia),
        opciones: d.menusSemana.filter(m=>m.dia===dia)
      });
    });
  });
  return diasInfo;
}
function exportarSodexo(semana, diasInfo, elegibles, nombreSitio){
  const wb = XLSX.utils.book_new();
  const usados = new Set();
  XLSX.utils.book_append_sheet(wb, hojaGeneralSodexo(elegibles, diasInfo), nombreHojaUnico('General', usados));
  diasInfo.forEach(d=>{
    XLSX.utils.book_append_sheet(wb, hojaDiaSodexo(d.pedidos, d.opciones, elegibles, nombreSitio, d.label), nombreHojaUnico(d.label.split(' ')[0], usados));
  });
  XLSX.writeFile(wb, `reporte_sodexo_${semana}.xlsx`);
}
// Reporte Sodexo de un periodo: hoja "General" con todos los días de todas
// las semanas del rango uno al lado del otro, más una hoja por cada día de
// cada semana con menú publicado.
function elegiblesUnicosPeriodo(datosPorSemana){
  const elegiblesUnicos = [];
  const vistos = new Set();
  datosPorSemana.forEach(d=>d.elegibles.forEach(t=>{
    const clave = normRut(t.rut);
    if(!vistos.has(clave)){ vistos.add(clave); elegiblesUnicos.push(t); }
  }));
  return elegiblesUnicos;
}

function abrirVentanaHtmlParaImprimir(html){
  const ventana = window.open('', '_blank');
  if(!ventana){ avisar('El navegador bloqueó la ventana nueva. Permite ventanas emergentes para generar el PDF.', 'warn'); return; }
  ventana.document.open();
  ventana.document.write(html);
  ventana.document.close();
  setTimeout(()=>{ try{ ventana.focus(); ventana.print(); }catch(e){} }, 300);
}

function exportarNoAnotadosExcel(nombreArchivo, nombreSitio, subtitulo, noAnotados, extraInfo, extraTitulo){
  if(!noAnotados.length){ avisar('Nadie falta por anotarse 🎉', 'ok'); return; }
  const lista = noAnotados.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre)));
  const filas = [];
  if(nombreSitio) filas.push([nombreSitio]);
  filas.push([subtitulo]);
  filas.push([]);
  const encabezado = ['N°','Nombre','RUT','Tipo'];
  if(extraTitulo) encabezado.push(extraTitulo);
  filas.push(encabezado);
  lista.forEach((t,idx)=>{
    const fila = [idx+1, t.nombre, t.rut, t.tipo];
    if(extraInfo) fila.push(extraInfo(t));
    filas.push(fila);
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filas), 'No anotados');
  XLSX.writeFile(wb, nombreArchivo);
}
// Exporta un solo .xlsx con 4 hojas: resumen a gran escala (por opción),
// desglose por nombre de plato, y el registro de personas (anotados y sin
// anotarse) cada uno en su propia hoja.
function exportarExcel(semana, anotados, noAnotados, pedidosSemana, menusSemana, diasEspeciales){
  const dias = DIAS.filter(d=>menusSemana.some(m=>m.dia===d));
  const nombreDia = d => d + (diasEspeciales&&diasEspeciales.has(d)?' (mejorado)':'');
  const wb = XLSX.utils.book_new();

  // Hoja 1: Resumen (a gran escala, por código de opción)
  const codigos = Array.from(new Set(menusSemana.map(m=>m.opcion))).sort();
  const filasResumen = [['Opción', ...dias.map(nombreDia)]];
  codigos.forEach(cod=>{
    filasResumen.push([cod, ...dias.map(d=>pedidosSemana.filter(p=>p.dia===d && p.opcion===cod).length)]);
  });
  filasResumen.push(['Total colaciones', ...dias.map(d=>contarColacionesDia(pedidosSemana.filter(p=>p.dia===d), menusSemana.filter(m=>m.dia===d)))]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasResumen), 'Resumen');

  // Hoja 2: Desglose por nombre de plato y cantidad
  const filasDesglose = [['Día','Opción','Plato','Cantidad']];
  dias.forEach(d=>{
    menusSemana.filter(m=>m.dia===d).sort((a,b)=>String(a.opcion).localeCompare(String(b.opcion))).forEach(m=>{
      const n = pedidosSemana.filter(p=>p.dia===d && p.opcion===m.opcion).length;
      filasDesglose.push([nombreDia(d), m.opcion, m.descripcion||'', n]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasDesglose), 'Desglose por plato');

  // Hoja 3: Anotados, con el plato elegido cada día
  const menusPorDia = {};
  dias.forEach(d=>{ menusPorDia[d] = menusSemana.filter(m=>m.dia===d); });
  const filasAnotados = [['N°','Nombre','RUT','Tipo', ...dias.map(nombreDia)]];
  anotados.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre))).forEach((t,idx)=>{
    const fila = [idx+1, t.nombre, t.rut, t.tipo];
    dias.forEach(d=>{
      const p = pedidosSemana.find(x=>normRut(x.rut)===normRut(t.rut) && x.dia===d);
      if(!p){ fila.push('Sin elegir'); return; }
      const m = (menusPorDia[d]||[]).find(x=>String(x.opcion)===String(p.opcion));
      fila.push(m ? `${p.opcion}: ${m.descripcion||''}` : p.opcion);
    });
    filasAnotados.push(fila);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasAnotados), 'Anotados');

  // Hoja 4: Sin anotarse
  const filasSinAnotar = [['N°','Nombre','RUT','Tipo']];
  noAnotados.slice().sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre))).forEach((t,idx)=>{
    filasSinAnotar.push([idx+1, t.nombre, t.rut, t.tipo]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasSinAnotar), 'Sin anotarse');

  XLSX.writeFile(wb, `colaciones_${semana}.xlsx`);
}

// Junta los datos de cada semana (datosSemana) dentro de un rango de
// fechas elegido a mano, para ver totales de varias semanas juntas en
// vez de semana por semana.
function semanasEnPeriodo(desdeIso, hastaIso){
  const semanas = [];
  let cursor = mondayOf(new Date(desdeIso+'T00:00:00'));
  const limite = new Date(hastaIso+'T00:00:00');
  let guarda = 0;
  while(cursor <= limite && guarda < 260){ // tope de seguridad: 5 años
    semanas.push(iso(cursor));
    cursor = addDays(cursor,7);
    guarda++;
  }
  return semanas;
}

  const conMenu = datosPorSemana.filter(d=>d.menusSemana.length);
  const wb = XLSX.utils.book_new();

  const totalColaciones = datosPorSemana.reduce((s,d)=>s+totalColacionesSemana(d.pedidosSemana, d.menusSemana),0);
  const totalMejoradas = datosPorSemana.reduce((s,d)=>s+d.pedidosEspeciales,0);
  const totalAnotados = datosPorSemana.reduce((s,d)=>s+d.anotados.length,0);
  const totalNoAnotados = datosPorSemana.reduce((s,d)=>s+d.noAnotados.length,0);
  const filasResumen = [
    ['Periodo', `${fmtFechaCorta(desde)} al ${fmtFechaCorta(hasta)}`],
    ['Semanas con menú publicado', conMenu.length],
    ['Colaciones en el periodo', totalColaciones],
    ['Colaciones mejoradas', totalMejoradas],
    ['Anotados (suma semanas)', totalAnotados],
    ['Sin anotarse (suma semanas)', totalNoAnotados]
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasResumen), 'Resumen periodo');

  const filasDetalle = [['Semana','Elegibles','Anotados','Sin anotarse','Colaciones','Mejoradas']];
  conMenu.forEach(d=>{
    filasDetalle.push([fmtFechaCorta(d.semana), d.elegibles.length, d.anotados.length, d.noAnotados.length, totalColacionesSemana(d.pedidosSemana, d.menusSemana), d.pedidosEspeciales]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasDetalle), 'Detalle por semana');

  const filasFaltas = [['N°','Nombre','RUT','Tipo','N° semanas sin anotarse','Semanas']];
  listaFaltas.forEach((f,idx)=>{
    filasFaltas.push([idx+1, f.nombre, f.rut, f.tipo, f.semanas.length, f.semanas.map(fmtFechaCorta).join(', ')]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(filasFaltas), 'Sin anotarse');

  XLSX.writeFile(wb, `colaciones_periodo_${desde}_a_${hasta}.xlsx`);
}

// ---------- dom helper ----------
function el(tag, attrs, ...children){
  const n = document.createElement(tag);
  Object.entries(attrs||{}).forEach(([k,v])=>{
    if(k==='hidden'){ n.hidden = true; return; }
    if(k==='style'){ n.setAttribute('style',v); return; }
    n.setAttribute(k,v);
  });
  children.forEach(c=>{
    if(c==null) return;
    n.appendChild(typeof c==='string'||typeof c==='number' ? document.createTextNode(c) : c);
  });
  return n;
}
function field(labelText, type, id, placeholder, isRut, autocomplete){
  const f = el('div',{class:'field'});
  f.appendChild(el('label',{for:id}, labelText));
  const attrs = {type, id, name:id, placeholder: placeholder||''};
  if(isRut){ attrs.inputmode='text'; attrs.autocapitalize='characters'; attrs.maxlength='12'; }
  if(autocomplete) attrs.autocomplete = autocomplete;
  const input = el('input',attrs);
  if(isRut) input.addEventListener('input', ()=>{ input.value = formatRut(input.value); });
  f.appendChild(input);
  return f;
}
// Campo de clave con un botón de "ojo" para mostrar/ocultar el texto
// mientras se escribe, y con autocomplete="current-password" para que el
// navegador pueda ofrecer guardarla (evita que alguien la tenga que teclear
// de memoria cada vez, y reduce errores de tipeo al no verla).
function fieldPassword(labelText, id, autocomplete){
  const f = el('div',{class:'field'});
  f.appendChild(el('label',{for:id}, labelText));
  const wrap = el('div',{style:'position:relative'});
  const input = el('input',{type:'password', id, name:id, placeholder:'', autocomplete:autocomplete||'current-password', style:'padding-right:40px'});
  const btnEye = el('button',{type:'button', 'aria-label':'Mostrar clave',
    style:'position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;padding:6px;line-height:1'},
    '👁️');
  btnEye.onclick = ()=>{
    const mostrando = input.type==='text';
    input.type = mostrando ? 'password' : 'text';
    btnEye.textContent = mostrando ? '👁️' : '🙈';
    btnEye.setAttribute('aria-label', mostrando ? 'Mostrar clave' : 'Ocultar clave');
  };
  wrap.append(input, btnEye);
  f.appendChild(wrap);
  return f;
}
// Da formato XXXXXXXX-X a un RUT chileno mientras se escribe (acepta con o sin puntos/guion).
function formatRut(value){
  let v = String(value||'').toUpperCase().replace(/[^0-9K]/g,'');
  if(v.length <= 1) return v;
  const cuerpo = v.slice(0,-1);
  const dv = v.slice(-1);
  return cuerpo + '-' + dv;
}

render();
})();
